[package]
name = "px-bench-comparative"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenPX-vs-official-SDK head-to-head benchmarks. Not part of the published surface."

[lib]
path = "src/lib.rs"
bench = false
test = false
doctest = false

[dev-dependencies]
px-core = { workspace = true, features = ["simd-json"] }
# Polymarket's official Rust SDK — the one px-exchange-polymarket already
# depends on. Pinned to the same canary as that crate so the comparison
# stays honest if/when the SDK breaks.
polymarket_client_sdk_v2 = { version = "=0.6.0-canary.1", features = ["clob"] }
# Codspeed-instrumented criterion. Drop-in API replacement: same macros,
# same `Criterion`, same `bench_function`. Under `cargo codspeed run`,
# the harness emits cycle-count / memory / walltime measurements; under
# plain `cargo bench` it falls through to vanilla criterion timings, so
# local runs still work without the Codspeed CLI installed.
codspeed-criterion-compat = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "parse_polymarket_book"
harness = false
