name: Bench

# Comparative benchmark suite — runs on every push to main, refreshes
# the captured fixtures from live 5/15-min BTC markets, runs Rust /
# Python / TS comparative benches under Codspeed instruments, then
# rewrites the `<!-- BENCH:START -->` block in README.md with the
# latest numbers and pushes the diff back to main.
#
# README.md and `benches/comparative/{fixtures,results}/**` are excluded
# from triggers so the auto-commit doesn't loop; the commit message also
# carries `[skip ci]` as belt-and-suspenders.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "benches/comparative/fixtures/**"
      - "benches/comparative/results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  bench:
    name: Comparative benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for the auto-commit push to fast-forward main.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-codspeed,iai-callgrind-runner@0.14

      - name: Set up .venv with build + bench tooling
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            maturin pydantic datamodel-code-generator \
            pytest pytest-benchmark pytest-codspeed
          # Comparison targets — best-effort install so the suite still
          # produces a valid (smaller) table when an upstream package is
          # broken on the runner's platform. `kalshi-python` also requires
          # `cryptography` for its API-key signing path; install it
          # explicitly because the upstream package doesn't pin it.
          .venv/bin/pip install py-clob-client || true
          .venv/bin/pip install kalshi-python cryptography || true

      - name: Build OpenPX SDKs against current Rust core
        run: just venv="$(pwd)/.venv" python-build node-build

      - name: Refresh real-data fixtures from live 5/15-min BTC markets
        run: .venv/bin/python tools/capture_bench_fixtures.py

      - name: Install TS bench deps
        working-directory: benches/comparative/typescript
        run: |
          npm install
          # Optional comparison targets. Use --legacy-peer-deps because
          # @polymarket/clob-client pins older peer deps that would
          # otherwise fail ERESOLVE.
          npm install --no-save --legacy-peer-deps @polymarket/clob-client || true
          # Kalshi's official TS SDK ships under `kalshi-typescript`
          # (OpenAPI-generated axios client); the others are community
          # / older variants probed as fallback.
          for pkg in kalshi-typescript kalshi-typescript-sdk kalshi-ts @kalshi/sdk; do
            npm install --no-save --legacy-peer-deps "$pkg" && break || true
          done

      # ---------------------------------------------------------------
      # Codspeed: build then run under each instrument. Every harness is
      # wrapped in `CodSpeedHQ/action@v3` so all three modes (CPU sim,
      # memory, walltime) feed the dashboard with PR-level regression
      # alerts. The plugins simultaneously emit local JSON
      # (criterion/pytest-benchmark/tinybench) which the render step
      # turns into the README matrix.
      # ---------------------------------------------------------------

      - name: Build Rust bench under Codspeed
        run: cargo codspeed build -p px-bench-comparative

      - name: Codspeed — Rust CPU simulation
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: cargo codspeed run -p px-bench-comparative --measurement-mode simulation
        continue-on-error: true

      - name: Codspeed — Rust memory
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: cargo codspeed run -p px-bench-comparative --measurement-mode memory
        continue-on-error: true

      - name: Codspeed — Rust walltime
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: cargo codspeed run -p px-bench-comparative --measurement-mode walltime

      # `cargo codspeed run` doesn't emit `target/criterion` JSON in
      # instrumented mode — it pipes measurements straight to the
      # Codspeed protocol. Run vanilla `cargo bench` once afterwards to
      # produce the local criterion JSON the render step reads. Cheap
      # because the bench profile is already cached from the codspeed
      # build above; only the harness re-runs.
      - name: Refresh local criterion JSON for README render
        run: cargo bench -p px-bench-comparative -- --warm-up-time 1 --measurement-time 2

      # iai-callgrind drives valgrind (cachegrind + DHAT) and writes
      # per-bench JSON summaries to `target/iai/...` that the render
      # step turns into the CPU-instructions and heap-allocation rows of
      # the Rust comparison table. The `iai` feature gate keeps this
      # bench out of plain `cargo bench` so non-Linux dev (macOS) keeps
      # working with just the criterion walltime harness.
      - name: Codspeed-equivalent Rust CPU + memory via iai-callgrind
        run: cargo bench -p px-bench-comparative --features iai --bench parse_polymarket_book_iai
        continue-on-error: true

      - name: Codspeed — Python walltime (Polymarket)
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: .venv/bin/pytest benches/comparative/python/bench_polymarket.py --codspeed -q

      - name: Codspeed — Python walltime (Kalshi)
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: .venv/bin/pytest benches/comparative/python/bench_kalshi.py --codspeed -q

      # Second pass to populate the local pytest-benchmark JSON for the
      # README render. `--codspeed` and `--benchmark-only` collect via
      # different timing plugins; running them in separate passes keeps
      # both data sources clean.
      - name: Local pytest-benchmark JSON for README
        run: |
          mkdir -p benches/comparative/results
          .venv/bin/pytest benches/comparative/python/bench_polymarket.py \
            --benchmark-only \
            --benchmark-json=benches/comparative/results/python_polymarket.json -q || true
          .venv/bin/pytest benches/comparative/python/bench_kalshi.py \
            --benchmark-only \
            --benchmark-json=benches/comparative/results/python_kalshi.json -q || true

      - name: Codspeed — TypeScript walltime (Polymarket)
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: |
            cd benches/comparative/typescript
            node bench_polymarket.mjs > ../results/typescript_polymarket.json

      - name: Codspeed — TypeScript walltime (Kalshi)
        uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: |
            cd benches/comparative/typescript
            node bench_kalshi.mjs > ../results/typescript_kalshi.json

      - name: Render bench results into README.md
        run: python3 tools/render_bench_readme.py

      - name: Commit updated README + fixtures
        run: |
          if git diff --quiet README.md benches/comparative/fixtures/ benches/comparative/results/; then
            echo "No bench changes to commit."
            exit 0
          fi
          git config user.name "openpx-bench-bot"
          git config user.email "bench-bot@users.noreply.github.com"
          git add README.md benches/comparative/fixtures/ benches/comparative/results/
          git commit -m "chore(bench): refresh comparative numbers + fixtures [skip ci]"
          git push origin HEAD:main
