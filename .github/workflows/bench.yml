name: Bench

# Comparative benchmark suite — runs on every push to main, refreshes
# the captured fixtures from live 5/15-min BTC markets, then runs the
# Rust / Python / TS comparative benches under CodSpeed instruments.
#
# CodSpeed is the single source of measurement truth. The README's
# `<!-- BENCH:START -->` block is NOT regenerated here — it's refreshed
# per release by running `/refresh-bench-readme` against the CodSpeed
# MCP server (see benches/comparative/README.md).
#
# `benches/comparative/fixtures/**` is excluded from triggers so the
# fixture auto-commit doesn't loop; the commit message also carries
# `[skip ci]` as belt-and-suspenders.

on:
  push:
    branches: [main]
    paths-ignore:
      - "benches/comparative/fixtures/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  bench:
    name: Comparative benchmarks
    runs-on: codspeed-macro
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for the fixture auto-commit push to fast-forward main.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-codspeed

      - name: Set up .venv with build + bench tooling
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            maturin pydantic datamodel-code-generator \
            pytest pytest-codspeed
          # Comparison targets — best-effort install so the suite still
          # produces a valid (smaller) CodSpeed run when an upstream package is
          # broken on the runner's platform. `kalshi-python` also requires
          # `cryptography` for its API-key signing path; install it
          # explicitly because the upstream package doesn't pin it.
          .venv/bin/pip install py-clob-client || true
          .venv/bin/pip install kalshi-python cryptography || true

      - name: Install TS bench deps (incl. napi for SDK build)
        working-directory: sdks/typescript
        run: npm install

      - name: Build OpenPX SDKs against current Rust core
        run: just venv="$(pwd)/.venv" python-build node-build

      - name: Refresh real-data fixtures from live 5/15-min BTC markets
        run: .venv/bin/python tools/capture_bench_fixtures.py

      - name: Install TS comparative bench deps
        working-directory: benches/comparative/typescript
        run: |
          npm install
          # Optional comparison targets. Use --legacy-peer-deps because
          # @polymarket/clob-client pins older peer deps that would
          # otherwise fail ERESOLVE.
          npm install --no-save --legacy-peer-deps @polymarket/clob-client || true
          # Kalshi's official TS SDK ships under `kalshi-typescript`
          # (OpenAPI-generated axios client); the others are community
          # / older variants probed as fallback.
          for pkg in kalshi-typescript kalshi-typescript-sdk kalshi-ts @kalshi/sdk; do
            npm install --no-save --legacy-peer-deps "$pkg" && break || true
          done

      # ---------------------------------------------------------------
      # CodSpeed: build then run under each instrument. Every harness is
      # wrapped in `CodSpeedHQ/action@v4` so all three modes (CPU sim,
      # memory, walltime) feed the dashboard with PR-level regression
      # alerts. The dashboard is the only sink — no local JSON.
      # ---------------------------------------------------------------

      - name: Build Rust bench under CodSpeed
        run: cargo codspeed build -p px-bench-comparative

      - name: CodSpeed — Rust CPU simulation
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run -p px-bench-comparative
        continue-on-error: true

      - name: CodSpeed — Rust memory
        uses: CodSpeedHQ/action@v4
        with:
          mode: memory
          run: cargo codspeed run -p px-bench-comparative
        continue-on-error: true

      - name: CodSpeed — Rust walltime
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: cargo codspeed run -p px-bench-comparative

      - name: CodSpeed — Python walltime (Polymarket)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: .venv/bin/pytest benches/comparative/python/bench_polymarket.py --codspeed -q

      - name: CodSpeed — Python walltime (Kalshi)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: .venv/bin/pytest benches/comparative/python/bench_kalshi.py --codspeed -q

      - name: CodSpeed — TypeScript walltime (Polymarket)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: |
            cd benches/comparative/typescript
            node bench_polymarket.mjs

      - name: CodSpeed — TypeScript walltime (Kalshi)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: |
            cd benches/comparative/typescript
            node bench_kalshi.mjs

      - name: Commit refreshed fixtures
        run: |
          if git diff --quiet benches/comparative/fixtures/; then
            echo "No fixture changes to commit."
            exit 0
          fi
          git config user.name "openpx-bench-bot"
          git config user.email "bench-bot@users.noreply.github.com"
          git add benches/comparative/fixtures/
          git commit -m "chore(bench): refresh comparative fixtures [skip ci]"
          git push origin HEAD:main
